<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamPulse — Class 6–12 Board Exam Prep (BSEB &amp; CBSE)</title>
    <meta
      name="description"
      content="ExamPulse — Modern, responsive Ed-Tech platform for Class 6 to 12 Board Exam preparation featuring chapter-wise notes, objective &amp; subjective Q&amp;A, and interactive mock tests."
    />
    <meta name="theme-color" content="#2563EB" />
    <link rel="manifest" href="./public/manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Noto Sans Devanagari', 'system-ui', 'sans-serif'],
              heading: ['Poppins', 'Noto Sans Devanagari', 'sans-serif'],
              hindi: ['Noto Sans Devanagari', 'Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#EFF6FF',
                100: '#DBEAFE',
                200: '#BFDBFE',
                500: '#3B82F6',
                600: '#2563EB',
                700: '#1D4ED8',
                900: '#1E3A8A',
              },
              accent: {
                50: '#ECFDF5',
                500: '#10B981',
                600: '#059669',
              },
              warm: {
                50: '#FFFBEB',
                500: '#F59E0B',
                600: '#D97706',
              },
            },
          },
        },
      };
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Inter', 'Noto Sans Devanagari', system-ui, sans-serif;
      }
      h1, h2, h3, .font-heading {
        font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-brand-600 selection:text-white">
    <div id="root"></div>

    <!-- Primary Live Runtime: Browser-native ES Module App -->
    <script type="module" src="./public/exampulse-live.js"></script>
    <script src="./public/class9-math50-injector.js" defer></script>

    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
        <h2>JavaScript Required</h2>
        <p>Please enable JavaScript in your browser to run ExamPulse.</p>
      </div>
    </noscript>
  </body>
</html>
